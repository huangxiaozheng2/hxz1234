[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manjuflow"
version = "0.1.0"
description = "开源 AI 漫剧工作流：从故事到成片（剧本、分镜、配音、运镜、字幕、合成）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "Pillow>=9.2"]

[project.optional-dependencies]
edge = ["edge-tts>=6"]

[project.scripts]
manju = "manjuflow.cli:main"

[tool.setuptools.packages.find]
include = ["manjuflow*"]
