# ==========================================
# 淮安印记 —— 内容配置文件
# ==========================================
# 游戏里所有的文字、展区、题目、图片和音效都在这里配置。
# 改内容只需要改这个文件和 assets/ 文件夹，不用动代码。


project:
  name: "淮安印记"
  description: "运河之都 · 淮安文旅互动之旅"
  mascot_name: "小印"               # 开场故事里会高亮显示的吉祥物名字
  theme:
    primary_color: "#9e2b25"        # 朱砂红（印泥色）
    secondary_color: "#d4a73a"      # 鎏金
  global_audio:
    correct_sfx: "assets/audio/correct.mp3"
    incorrect_sfx: "assets/audio/incorrect.mp3"
    chime_sfx: "assets/audio/fanfare.mp3"


# 1. 入口（扫码页 qr.html）
qr_screen:
  title: "淮安印记"
  subtitle: "运河之都 · 文旅互动之旅"
  instruction: "扫码开始游戏"
  # 二维码会根据当前网址自动生成；如需固定网址，请填写下面一项
  game_url: ""
  error_message: "页面好像走丢了，请重新扫一下二维码吧！"
  retry_button: "重试"

loading_screen:
  logo: "assets/icons/logo.png"
  loading_text: "正在加载……"
  timeout_ms: 3000


# 2. 首页
intro_screen:
  background_image: "assets/images/intro-bg.jpg"
  title: "淮安印记"
  subtitle: "运河之都 · 文旅之旅"
  intro_text: "打开声音，跟着小印走过淮安的四个地方，集齐印章，赢取「淮安文旅达人」徽章！"
  start_button: "开始旅程"


# 3. 开场故事
prologue_screen:
  skip_button: "跳过"
  cta_button: "出发！"
  ambient_audio: "assets/audio/ambient.mp3"
  lines:
    - id: "p1"
      text: "你好呀，我是小印——一枚来自淮安的老印章。"
      effect: "typewriter"
    - id: "p2"
      text: "千百年来，运河上的船来船往，小印在每一处名胜都留下过印记。可是一阵风吹过，印记都散落到了淮安的各个角落……"
      effect: "fade-up"
    - id: "p3"
      text: "跟着地图走过四个地方，听小印讲讲这里的故事，再完成一个小挑战，就能把印记一个个找回来。"
      effect: "fade-up"
    - id: "p4"
      text: "集齐所有印记，小印就能回家啦。你也会得到一枚专属徽章，留作这趟旅程的纪念。"
      effect: "fade-up"
    - id: "p5"
      text: "准备好了吗？小印在等你哦！"
      effect: "fade-up"


# 3.5 旅程地图
map_screen:
  background_image: "assets/images/map.png"
  title: "你的淮安之旅"
  cta_button: "开始探索"


# 4. 展区故事（左右滑动切换）
# 每个展区可以写 audio（mp3 讲解）。不写的话，会用手机自带的语音朗读文字。
zones:
  - id: "zone-01"
    order: 1
    name: "第一站 · 周恩来故里"
    thumbnail: "assets/images/zone-01.jpg"
    slides:
      - image: "assets/images/zone-01.jpg"
        text: "1898年，周恩来出生在淮安城内驸马巷的一座青砖小院里，在这里度过了童年。他少年时立下“为中华之崛起而读书”的志向，后来成为新中国第一任总理。如今，故居、周恩来纪念馆和童年读书处都向公众开放，静静讲述着一代伟人的初心。"

  - id: "zone-02"
    order: 2
    name: "第二站 · 河下古镇"
    thumbnail: "assets/images/zone-02.jpg"
    slides:
      - image: "assets/images/zone-02.jpg"
        text: "走进河下古镇，石板路两旁是明清老宅。《西游记》的作者吴承恩就是淮安人，他的故居就在这里。相传他从小爱听神怪故事，晚年写下了孙悟空保护唐僧西天取经的传奇。一根金箍棒、一朵筋斗云，从淮安的小院一直飞进了全世界读者的心里。"

  - id: "zone-03"
    order: 3
    name: "第三站 · 清江浦 · 大运河"
    thumbnail: "assets/images/zone-03.jpg"
    slides:
      - image: "assets/images/zone-03.jpg"
        text: "淮安被称为“运河之都”。明清两代，掌管全国漕运的漕运总督府就设在淮安，南来北往的粮船都要在这里过闸。1415年，陈瑄开凿清江浦河，清江浦从此繁华起来，有“南船北马，舍舟登陆”之说。2014年，大运河成功申遗，淮安的清口枢纽和漕运总督府遗址都是其中的重要组成部分。"

  - id: "zone-04"
    order: 4
    name: "第四站 · 淮扬美食"
    thumbnail: "assets/images/zone-04.jpg"
    slides:
      - image: "assets/images/zone-04.jpg"
        text: "淮安是淮扬菜的发源地之一。1949年的“开国第一宴”，主打的就是淮扬菜。来淮安一定要尝尝软兜长鱼——长鱼就是黄鳝，口感滑嫩；还有平桥豆腐和文楼汤包。吃汤包有个口诀：“轻轻提，慢慢移，先开窗，后喝汤”，小心别被烫到哦！"


# 5. 小游戏 / 答题挑战
quiz_game:
  challenge_screen:
    title: "印记挑战"
    description: "四站都走完啦！答对问题，就能把散落的印记一个个盖回来。准备好了吗？"
    start_button: "开始挑战"

  questions:
    - id: "q1"
      related_zone: "zone-01"
      question: "周恩来出生于哪一年？"
      options:
        - "1893年"
        - "1898年"
        - "1904年"
      correct_index: 1        # 从 0 开始数
      success_message: "你找回了一枚印记！"
      error_message: "正确答案是 1898 年。"
      explanation: "1898年3月5日，周恩来出生在淮安城内驸马巷的周家老宅，也就是今天的周恩来故居。"

    - id: "q2"
      related_zone: "zone-02"
      question: "《西游记》的作者是谁？"
      options:
        - "施耐庵"
        - "罗贯中"
        - "吴承恩"
      correct_index: 2
      success_message: "你找回了一枚印记！"
      error_message: "正确答案是吴承恩。"
      explanation: "吴承恩是明代淮安府山阳县（今淮安区）人，故居位于河下古镇附近。"

    - id: "q3"
      related_zone: "zone-03"
      question: "明清时期掌管全国漕运的“漕运总督府”设在哪里？"
      options:
        - "淮安"
        - "扬州"
        - "杭州"
      correct_index: 0
      success_message: "你找回了一枚印记！"
      error_message: "正确答案是淮安。"
      explanation: "漕运总督驻扎淮安，统管南粮北运，淮安也因此被称为“运河之都”。漕运总督府遗址就在今天淮安区的镇淮楼北面。"

    - id: "q4"
      related_zone: "zone-04"
      question: "淮安名菜“软兜长鱼”里的“长鱼”指的是什么？"
      options:
        - "鲤鱼"
        - "黄鳝"
        - "带鱼"
      correct_index: 1
      success_message: "最后一枚印记，到手啦！"
      error_message: "正确答案是黄鳝。"
      explanation: "淮安人把黄鳝叫作“长鱼”。软兜长鱼选用小黄鳝的脊背肉烹制，夹起来两头下垂、像个兜子，所以叫“软兜”。"


# 6. 结束页（徽章）
endscreen:
  title: "恭喜你，集齐淮安印记！"
  message: "小印终于回家啦。你已获得「淮安文旅达人」徽章，快分享给朋友，约他们一起来淮安吧！"
  score_template: "答对 {score} / {total} 题"
  share_text: "我刚刚完成了「淮安印记」文旅之旅，获得了淮安文旅达人徽章！"
  share_button: "分享给朋友"
  replay_button: "再玩一次"
  share_copied_toast: "链接已复制，快去粘贴给朋友吧！"
  badge_image: "assets/icons/badge.png"
  polaroids:
    - image: "assets/images/zone-03.jpg"
      label: "清江浦"
      rotation: "-8deg"
      delay: "1.2s"
      position: "left"
    - image: "assets/images/zone-02.jpg"
      label: "河下古镇"
      rotation: "6deg"
      delay: "1.5s"
      position: "right"
    - image: "assets/images/zone-04.jpg"
      label: "淮扬美食"
      rotation: "5deg"
      delay: "1.8s"
      position: "left-low"


# 7. 全局异常提示
exceptions:
  offline_toast: "网络好像断开了，正在重新连接……"
